# Render Blueprint Specification for TechSprout School LMS
# Declaratively provisions:
# 1. NestJS REST API Web Service (Node.js runtime, pnpm monorepo)
# 2. Managed PostgreSQL 16 Database (with pre-deploy migrations & seeds)
# 3. Managed Redis / Key-Value Store (BullMQ queue & session engine)

services:
  - type: web
    name: techsprout-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @techsprout/contracts build && pnpm --filter @techsprout/api build
    startCommand: node apps/api/dist/database/migrate.js && node apps/api/dist/database/seed/seed.js && node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: techsprout-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: techsprout-redis
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://techsprout-frthqjqb8-tech-sprout.vercel.app,https://techsprout-git-feat-p1-foundation-security-tech-sprout.vercel.app

  - type: keyvalue
    name: techsprout-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: techsprout-postgres
    databaseName: techsprout
    user: techsprout
    plan: free
    region: oregon
    postgresMajorVersion: 16
